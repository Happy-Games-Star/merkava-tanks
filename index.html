<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merkava Come Back - Tanks Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1c4a;--blue:#2f7bff;--sky:#6db3ff;--gold:#ffcf3a;--gd:#d9921a;--green:#4fd44a;--gg:#2a9a26;--red:#ff5a4a;--f:"Lilita One","Arial Rounded MT Bold","Arial Black",Impact,sans-serif;--w:min(94vw,470px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--f);color:#fff;letter-spacing:.02em;background:radial-gradient(900px 500px at 50% 0,rgba(255,255,255,.28),transparent 70%),repeating-conic-gradient(#2a6fe0 0 25%,#2f7bff 0 50%) 0 0/64px 64px;display:flex;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
.ot{text-shadow:0 3px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy)}
.logo{text-align:center;line-height:1;margin:4px 0 10px}
.logo h1{margin:0;font-weight:400;font-size:clamp(30px,8.5vw,46px);color:var(--gold);transform:rotate(-2deg);text-shadow:0 4px 0 var(--gd),0 7px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy),3px 3px 0 var(--navy),-3px 3px 0 var(--navy),3px -3px 0 var(--navy),-3px -3px 0 var(--navy)}
.logo div{margin-top:10px;font-size:clamp(16px,4.5vw,22px);color:#fff;letter-spacing:.18em}
.hud{display:flex;gap:6px;width:var(--w);margin-bottom:10px}
.chip{flex:1;background:linear-gradient(#1a3a8f,var(--navy));border:3px solid var(--navy);border-radius:12px;padding:4px 6px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.2)}
.chip small{display:block;font-size:11px;color:var(--sky);line-height:1.1}
.chip b{font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap}
.wrap{position:relative;width:var(--w)}
.frame{padding:7px;border-radius:20px;background:linear-gradient(#ffe27a,var(--gold) 20%,var(--gd));border:5px solid var(--navy);box-shadow:0 7px 0 var(--navy),0 16px 28px rgba(0,0,30,.4)}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#4fa84c;border:3px solid var(--navy)}
.btn{font-family:var(--f);font-size:24px;letter-spacing:.03em;color:#fff;cursor:pointer;padding:10px 32px 12px;border-radius:15px;border:4px solid var(--navy);background:linear-gradient(#ffe27a,var(--gold) 30%,#f2a81f);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 5px 0 var(--gd),0 5px 0 4px var(--navy);transition:transform .08s,box-shadow .08s}
.btn span{text-shadow:0 3px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 1px 0 var(--gd),0 1px 0 4px var(--navy)}
.btn.g{background:linear-gradient(#a6f27a,var(--green) 35%,var(--gg));box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 5px 0 #1d6e1a,0 5px 0 4px var(--navy)}
.btn:focus-visible,.dif button:focus-visible{outline:3px solid #fff;outline-offset:4px}
#ov{position:absolute;inset:0;z-index:5;border-radius:20px;padding:18px;background:rgba(8,20,64,.92);border:5px solid var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#ov.show{opacity:1;pointer-events:auto}
#ov h2{margin:0;font-weight:400;font-size:clamp(34px,10vw,48px);color:var(--gold);text-shadow:0 4px 0 var(--gd),0 7px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy)}
#ov p{margin:0;font-size:19px;line-height:1.4;text-shadow:0 2px 0 var(--navy)}
#ov b{font-weight:400;color:var(--gold)}
.dif{display:flex;gap:8px}
.dif button{font-family:var(--f);font-size:20px;text-transform:capitalize;color:#fff;cursor:pointer;padding:8px 14px;border-radius:12px;border:3px solid var(--navy);background:linear-gradient(#3a5bb8,#1a3a8f);text-shadow:0 2px 0 var(--navy)}
.dif button.sel{background:linear-gradient(#a6f27a,var(--green) 40%,var(--gg))}
.bs{min-height:22px;color:var(--gold);font-size:17px;text-shadow:0 2px 0 var(--navy)}
.crowns{font-size:44px;display:flex;gap:4px;align-items:flex-end}
.pad{display:none;width:var(--w);justify-content:space-between;align-items:center;margin-top:16px;touch-action:none}
.dp{display:grid;grid-template:repeat(3,56px)/repeat(3,56px);gap:4px}
.pb,.fb{font-family:var(--f);color:#fff;border:4px solid var(--navy);cursor:pointer;touch-action:none;text-shadow:0 2px 0 var(--navy)}
.pb{font-size:24px;border-radius:14px;background:linear-gradient(#6db3ff,#1b5fd1);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--navy)}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.fb{width:104px;height:104px;border-radius:50%;font-size:26px;background:linear-gradient(#ff9a8d,var(--red) 40%,#c42a2a);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),0 6px 0 var(--navy)}
.fb:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
.hint{margin-top:14px;max-width:360px;text-align:center;font-size:15px;color:#dbe9ff;text-shadow:0 2px 0 var(--navy)}
#ov{overflow:auto}
.btn.sm{font-size:18px;padding:6px 22px 8px;box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 4px 0 var(--gd),0 4px 0 4px var(--navy)}
.hrow{margin-top:16px}
.how{text-align:left;max-width:390px}
#ov .how p{font-size:15px;line-height:1.35;margin:0 0 9px}
@media (pointer:coarse),(max-width:700px){.pad{display:flex}.hint{display:none}}
@media (prefers-reduced-motion:reduce){#ov{transition:none}}
</style>
</head>
<body>
<div class="logo"><h1>Merkava Come Back</h1><div class="ot">TANKS BATTLE</div></div>
<div class="hud">
  <div class="chip"><small>Level</small><b class="ot" id="lv">1/10</b></div>
  <div class="chip"><small>Lives</small><b id="li"></b></div>
  <div class="chip"><small>Enemies</small><b class="ot" id="en">0</b></div>
  <div class="chip"><small>Score</small><b class="ot" id="sc">0</b></div>
</div>
<div class="wrap">
  <div class="frame"><canvas id="cv" width="416" height="416"></canvas></div>
  <div id="ov" role="dialog"></div>
</div>
<div class="hrow"><button class="btn sm" id="hb"><span>? How to play</span></button></div>
<div class="pad">
  <div class="dp">
    <button class="pb" data-d="0" style="grid-area:1/2" aria-label="Up">▲</button>
    <button class="pb" data-d="3" style="grid-area:2/1" aria-label="Left">◀</button>
    <button class="pb" data-d="1" style="grid-area:2/3" aria-label="Right">▶</button>
    <button class="pb" data-d="2" style="grid-area:3/2" aria-label="Down">▼</button>
  </div>
  <button class="fb" id="fb">FIRE</button>
</div>
<div class="hint">Arrow keys or WASD to drive, Space to fire. Protect the crown tower!</div>

<script>
(function () {
var C = 32, N = 13, S = 416, $ = function (i) { return document.getElementById(i); };
var cv = $('cv'), ctx = cv.getContext('2d'), ov = $('ov');
var DIF = {
  easy:   { l: 5, s: .8,  f: 2.2, on: 3, c: .8,  b: .2 },
  normal: { l: 3, s: 1,   f: 1.6, on: 4, c: 1,   b: .3 },
  hard:   { l: 2, s: 1.2, f: 1.1, on: 5, c: 1.3, b: .45 }
};
var DV = [[0,-1],[1,0],[0,1],[-1,0]];
var dif = 'normal', lvl = 1, score = 0, ls = 0, lives = 3, map, tanks = [], bullets = [], fx = [];
var queue = 0, state = 'menu', player, spawnT = 0, spawnI = 0, time = 0, dirs = [], fire = false, ac = null, last = 0;
function D() { return DIF[dif]; }

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function beep(f, d, ty, v) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = ty; o.frequency.value = f; g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// 0 empty, 1 brick, 2 steel, 3 bush, 4 water, 5 tower, 6 ruins
function genMap(L) {
  var r = rng(L * 7919 + 13), m = [], i, j, a, b;
  for (i = 0; i < N; i++) m.push(new Array(N).fill(0));
  var pb = .2 + L * .015, ps = pb + .01 + L * .012, pw = ps + .02 + L * .004;
  for (i = 0; i < 12; i += 2) for (j = 0; j < 12; j += 2) {
    var q = r(), t = 0;
    if (q < pb) t = 1; else if (L > 1 && q < ps) t = 2; else if (L > 2 && q < pw) t = 4; else if (r() < .07) t = 3;
    for (a = 0; a < 2; a++) for (b = 0; b < 2; b++) m[i + a][j + b] = t;
  }
  for (i = 10; i < N; i++) for (j = 0; j < N; j++) if (m[i][j] == 2 || m[i][j] == 4) m[i][j] = 0;
  [0, 1].forEach(function (rr) { [0,1,5,6,7,11,12].forEach(function (cc) { m[rr][cc] = 0; }); });
  for (i = 11; i < N; i++) for (j = 3; j < 10; j++) m[i][j] = 0;
  m[12][5] = m[12][7] = m[11][5] = m[11][6] = m[11][7] = 1;
  m[12][6] = 5;
  return m;
}

function mk(x, y, ty) {
  var hp = ty == 'a' ? (dif == 'hard' ? 4 : 3) : 1;
  return { x: x, y: y, d: ty == 'p' ? 0 : 2, ty: ty, hp: hp, mx: hp, alive: true, cd: 1 + Math.random(), turn: 1, sh: 0,
    sp: ty == 'p' ? 105 : ty == 'f' ? 105 * D().s : ty == 'a' ? 60 * D().s : 72 * D().s };
}

function blocked(x, y, s) {
  if (x < 0 || y < 0 || x + 30 > S || y + 30 > S) return true;
  var c0 = Math.floor(x / C), c1 = Math.floor((x + 29.9) / C), r0 = Math.floor(y / C), r1 = Math.floor((y + 29.9) / C);
  for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) { var v = map[r][c]; if (v == 1 || v == 2 || v == 4 || v == 5) return true; }
  for (var k = 0; k < tanks.length; k++) { var o = tanks[k]; if (o !== s && o.alive && Math.abs(o.x - x) < 30 && Math.abs(o.y - y) < 30) return true; }
  return false;
}
function snap(v) { return Math.round((v - 1) / C) * C + 1; }

function turn(t, nd) {
  if (nd == t.d) return;
  if (nd % 2 != t.d % 2) {
    var sx = nd % 2 ? t.x : snap(t.x), sy = nd % 2 ? snap(t.y) : t.y;
    if (!blocked(sx, sy, t)) { t.x = sx; t.y = sy; }
  }
  t.d = nd;
}

function shoot(t, o) {
  var v = DV[t.d];
  bullets.push({ x: t.x + 15 + v[0] * 17, y: t.y + 15 + v[1] * 17, d: t.d, o: o, sp: o == 'p' ? 290 : 190 * (D().s > 1 ? 1.15 : 1) });
  beep(o == 'p' ? 520 : 260, .06, 'square', .04);
}
function boom(x, y, s) { fx.push({ x: x, y: y, t: 0, s: s }); }

function pick(t) {
  var r = Math.random(), nd, b = D().b;
  if (r < b) {
    var toBase = r < b * .5, tx = toBase ? 6 * C : player.x, ty = toBase ? 12 * C : player.y;
    var dx = tx - t.x, dy = ty - t.y;
    nd = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  } else nd = Math.random() < .4 ? 2 : Math.floor(Math.random() * 4);
  turn(t, nd);
}

function enemies() { return tanks.filter(function (t) { return t !== player && t.alive; }); }

function hitPlayer() {
  if (player.sh > 0) return;
  lives--; boom(player.x + 15, player.y + 15, 1.6); beep(90, .35, 'sawtooth', .09);
  if (lives <= 0) { player.alive = false; lose(); return; }
  player.x = 4 * C + 1; player.y = 12 * C + 1; player.d = 0; player.sh = 2.5;
  enemies().forEach(function (e) {
    if (Math.abs(e.x - player.x) < 34 && Math.abs(e.y - player.y) < 34) { e.alive = false; boom(e.x + 15, e.y + 15, 1); }
  });
}

function update(dt) {
  var p = player, k;
  if (p.alive) {
    k = dirs.length ? dirs[dirs.length - 1] : -1;
    if (k >= 0) {
      turn(p, k);
      var nx = p.x + DV[p.d][0] * p.sp * dt, ny = p.y + DV[p.d][1] * p.sp * dt;
      if (!blocked(nx, ny, p)) { p.x = nx; p.y = ny; }
    }
    p.cd -= dt; p.sh = Math.max(0, p.sh - dt);
    if (fire && p.cd <= 0) { shoot(p, 'p'); p.cd = .38; }
  }
  tanks.forEach(function (t) {
    if (t === p || !t.alive) return;
    t.turn -= dt; t.cd -= dt;
    var nx = t.x + DV[t.d][0] * t.sp * dt, ny = t.y + DV[t.d][1] * t.sp * dt;
    if (!blocked(nx, ny, t)) { t.x = nx; t.y = ny; } else t.turn = 0;
    if (t.turn <= 0) { pick(t); t.turn = .7 + Math.random() * 1.8; }
    if (t.cd <= 0) { shoot(t, 'e'); t.cd = D().f * (.6 + Math.random() * .9); }
  });
  bullets = bullets.filter(function (b) {
    if (b.dead) return false;
    var v = DV[b.d]; b.x += v[0] * b.sp * dt; b.y += v[1] * b.sp * dt;
    if (b.x < 0 || b.y < 0 || b.x >= S || b.y >= S) return false;
    var c = b.x / C | 0, r = b.y / C | 0, m = map[r][c];
    if (m == 1) { map[r][c] = 0; boom(b.x, b.y, .6); beep(110, .08, 'sawtooth', .06); return false; }
    if (m == 2) { boom(b.x, b.y, .3); beep(300, .04, 'square', .03); return false; }
    if (m == 5) { map[r][c] = 6; boom(c * C + 16, r * C + 16, 2.4); beep(70, .5, 'sawtooth', .1); lose(); return false; }
    var i, t, o;
    for (i = 0; i < bullets.length; i++) {
      o = bullets[i];
      if (o !== b && o.o != b.o && !o.dead && Math.abs(o.x - b.x) < 7 && Math.abs(o.y - b.y) < 7) { o.dead = true; return false; }
    }
    for (i = 0; i < tanks.length; i++) {
      t = tanks[i];
      if (!t.alive || (b.o == 'p') === (t === p)) continue;
      if (b.x > t.x && b.x < t.x + 30 && b.y > t.y && b.y < t.y + 30) {
        if (t === p) hitPlayer();
        else if (--t.hp <= 0) {
          t.alive = false; score += { b: 100, f: 200, a: 300 }[t.ty];
          boom(t.x + 15, t.y + 15, 1.2); beep(150, .15, 'sawtooth', .07);
        } else beep(200, .05, 'square', .04);
        return false;
      }
    }
    return true;
  });
  spawnT -= dt;
  if (queue > 0 && enemies().length < D().on && spawnT <= 0) {
    var px = [0, 6, 12][spawnI++ % 3] * C + 1, r = Math.random();
    var ty = lvl >= 5 && r < .12 + lvl * .02 ? 'a' : (lvl >= 3 && r < .4 ? 'f' : 'b');
    var e = mk(px, 1, ty);
    if (!blocked(px, 1, e)) { tanks.push(e); queue--; spawnT = 1.6; boom(px + 15, 16, .6); } else spawnT = .4;
  }
  tanks = tanks.filter(function (t) { return t.alive || t === p; });
  if (state == 'play' && queue == 0 && enemies().length == 0) levelClear();
}

function best() { try { return +localStorage.getItem('merkava-best-' + dif) || 0; } catch (e) { return 0; } }
function save() { try { if (score > best()) localStorage.setItem('merkava-best-' + dif, score); } catch (e) {} }

function show(h, p, html, btns) {
  ov.innerHTML = '<h2>' + h + '</h2>' + (p ? '<p>' + p + '</p>' : '') + (html || '');
  btns.forEach(function (b) {
    var e = document.createElement('button');
    e.className = 'btn ' + (b[2] || ''); e.innerHTML = '<span>' + b[0] + '</span>'; e.onclick = b[1];
    ov.appendChild(e);
  });
  ov.classList.add('show');
}
function hide() { ov.classList.remove('show'); }

function menu() {
  state = 'menu';
  var h = '<div class="dif">' + ['easy', 'normal', 'hard'].map(function (k) {
    return '<button data-k="' + k + '" class="' + (k == dif ? 'sel' : '') + '">' + k + '</button>';
  }).join('') + '</div><div class="bs" id="bs"></div>';
  show('Choose difficulty', '10 levels. Destroy every enemy tank and guard your crown tower.', h,
    [['Start battle', startGame, 'g'], ['? How to play', function () { help(menu); }, 'sm']]);
  var bs = $('bs'); bs.textContent = best() ? '🏆 Best score: ' + best() : '';
  ov.querySelectorAll('.dif button').forEach(function (b) {
    b.onclick = function () {
      dif = b.dataset.k;
      ov.querySelectorAll('.dif button').forEach(function (x) { x.classList.toggle('sel', x === b); });
      bs.textContent = best() ? '🏆 Best score: ' + best() : '';
    };
  });
}

function help(back) {
  var h = '<div class="how">' +
    '<p>👑 <b>Goal:</b> protect your crown tower and destroy all enemy tanks. Clear all 10 levels to win.</p>' +
    '<p>🎮 <b>Computer:</b> arrow keys or WASD to drive, Space to fire.<br>📱 <b>Phone:</b> arrow buttons to drive, FIRE button to shoot.</p>' +
    '<p>🧱 Bricks break, steel does not. Bushes hide tanks, water blocks them.<br>' +
    '❤️ You lose if the tower falls or you run out of lives. A shield protects you for a moment after a hit.</p></div>';
  show('How to play', '', h, [['Got it', back, 'g']]);
}
$('hb').onclick = function () {
  this.blur();
  if (state == 'play') { state = 'pause'; dirs = []; fire = false; help(function () { hide(); state = 'play'; }); }
  else if (state == 'menu') help(menu);
};

function startGame() { beep(440, .08, 'square', .05); lvl = 1; score = 0; ls = 0; lives = D().l; startLevel(); }
function startLevel() {
  map = genMap(lvl); tanks = []; bullets = []; fx = [];
  queue = Math.round((6 + lvl * 1.8) * D().c); spawnT = .6; spawnI = 0;
  player = mk(4 * C + 1, 12 * C + 1, 'p'); player.sh = 2; tanks.push(player);
  dirs = []; fire = false; state = 'play'; hide();
}
function lose() {
  if (state != 'play') return;
  state = 'over'; save();
  setTimeout(function () {
    show('Defeat', 'Level ' + lvl + ' · Score <b>' + score + '</b>', '', [
      ['Retry level', function () { score = ls; lives = D().l; startLevel(); }, 'g'], ['Menu', menu]]);
  }, 800);
}
function levelClear() {
  state = 'clear'; score += lives * 100; save();
  setTimeout(function () {
    if (lvl >= 10) {
      show('Victory!', 'Merkava is back!<br>Final score: <b>' + score + '</b>',
        '<div class="crowns">👑👑👑</div>', [['Play again', menu, 'g']]);
    } else {
      show('Level ' + lvl + ' cleared!', 'Score <b>' + score + '</b>', '', [['Next level', function () {
        lvl++; lives = Math.min(lives + 1, 5); ls = score; startLevel();
      }, 'g']]);
    }
  }, 700);
}

/* ---------- drawing ---------- */
var NV = '#0b1c4a';
function drawTank(t) {
  var col = { p: ['#4aa3ff', '#1b5fd1'], b: ['#ff6a5c', '#c42a2a'], f: ['#ffb13b', '#d97a0b'], a: ['#b56bff', '#6d2bc4'] }[t.ty];
  ctx.save(); ctx.translate(t.x + 15, t.y + 15); ctx.rotate(t.d * Math.PI / 2);
  ctx.lineWidth = 2; ctx.strokeStyle = NV;
  ctx.fillStyle = '#2b3350';
  ctx.fillRect(-15, -14, 7, 28); ctx.strokeRect(-15, -14, 7, 28);
  ctx.fillRect(8, -14, 7, 28); ctx.strokeRect(8, -14, 7, 28);
  ctx.fillStyle = t.ty == 'a' && t.hp < t.mx ? '#e0b8ff' : col[0];
  ctx.beginPath(); ctx.roundRect(-9, -12, 18, 24, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(-6, -9, 12, 3);
  ctx.fillStyle = col[0]; ctx.fillRect(-3, -20, 6, 14); ctx.strokeRect(-3, -20, 6, 14);
  ctx.fillStyle = col[1]; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.stroke();
  if (t.ty == 'p') { ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill(); }
  ctx.restore();
  if (t === player && t.sh > 0 && (t.sh > 1 || ((time * 10) | 0) % 2)) {
    ctx.strokeStyle = 'rgba(160,230,255,.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(t.x + 15, t.y + 15, 20, 0, 7); ctx.stroke();
  }
}

function draw() {
  var r, c, v, x, y, i;
  for (r = 0; r < N; r++) for (c = 0; c < N; c++) {
    x = c * C; y = r * C; v = map[r][c];
    ctx.fillStyle = (r + c) % 2 ? '#58b954' : '#4fa84c'; ctx.fillRect(x, y, C, C);
    ctx.lineWidth = 2; ctx.strokeStyle = NV;
    if (v == 1) {
      ctx.fillStyle = '#e88a3a'; ctx.fillRect(x + 1, y + 1, 30, 30);
      ctx.fillStyle = '#8a3f12';
      ctx.fillRect(x + 1, y + 10, 30, 2); ctx.fillRect(x + 1, y + 21, 30, 2);
      ctx.fillRect(x + 16, y + 1, 2, 9); ctx.fillRect(x + 8, y + 12, 2, 9); ctx.fillRect(x + 24, y + 12, 2, 9); ctx.fillRect(x + 16, y + 23, 2, 8);
      ctx.strokeRect(x + 1, y + 1, 30, 30);
    } else if (v == 2) {
      ctx.fillStyle = '#b8c4d6'; ctx.fillRect(x + 1, y + 1, 30, 30);
      ctx.fillStyle = '#8fa0b8'; ctx.fillRect(x + 7, y + 7, 18, 18);
      ctx.fillStyle = '#eef3fa';
      [[4, 4], [25, 4], [4, 25], [25, 25]].forEach(function (d) { ctx.fillRect(x + d[0], y + d[1], 3, 3); });
      ctx.strokeRect(x + 1, y + 1, 30, 30);
    } else if (v == 4) {
      ctx.fillStyle = '#2f8cff'; ctx.fillRect(x, y, C, C);
      ctx.fillStyle = '#9fd2ff';
      ctx.fillRect(x + 5 + Math.sin(time * 2 + r) * 3, y + 9, 10, 3);
      ctx.fillRect(x + 14 - Math.sin(time * 2 + c) * 3, y + 21, 12, 3);
    } else if (v == 5 || v == 6) {
      ctx.fillStyle = v == 5 ? '#ffcf3a' : '#5b6173'; ctx.fillRect(x + 1, y + 1, 30, 30); ctx.strokeRect(x + 1, y + 1, 30, 30);
      ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(v == 5 ? '👑' : '💥', x + 16, y + 17);
    }
  }
  tanks.forEach(function (t) { if (t.alive) drawTank(t); });
  bullets.forEach(function (b) {
    ctx.fillStyle = b.o == 'p' ? '#ffd23a' : '#ff5a4a'; ctx.strokeStyle = NV; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill(); ctx.stroke();
  });
  for (r = 0; r < N; r++) for (c = 0; c < N; c++) if (map[r][c] == 3) {
    x = c * C; y = r * C; ctx.fillStyle = '#2e9e3f'; ctx.strokeStyle = '#145a24'; ctx.lineWidth = 2;
    [[9, 9], [23, 9], [9, 23], [23, 23]].forEach(function (d) { ctx.beginPath(); ctx.arc(x + d[0], y + d[1], 9, 0, 7); ctx.fill(); ctx.stroke(); });
  }
  fx.forEach(function (f) {
    var k = f.t / .45, rad = (6 + k * 16) * f.s;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(f.x, f.y, rad, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(f.x, f.y, rad * .55, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function hud() {
  $('lv').textContent = lvl + '/10';
  $('li').textContent = lives > 0 ? '❤️'.repeat(lives) : '💀';
  $('en').textContent = queue + enemies().length;
  $('sc').textContent = score;
}

function frame(ts) {
  var dt = Math.min((ts - last) / 1000, .05) || 0; last = ts; time += dt;
  if (state == 'play') update(dt);
  fx = fx.filter(function (f) { return (f.t += dt) < .45; });
  draw(); hud();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function press(d) { if (dirs.indexOf(d) < 0) dirs.push(d); }
function release(d) { var i = dirs.indexOf(d); if (i >= 0) dirs.splice(i, 1); }
var KM = { ArrowUp: 0, w: 0, W: 0, ArrowRight: 1, d: 1, D: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3 };
document.addEventListener('keydown', function (e) {
  if (e.key in KM) { e.preventDefault(); press(KM[e.key]); }
  else if (e.key == ' ') { e.preventDefault(); fire = true; }
});
document.addEventListener('keyup', function (e) {
  if (e.key in KM) release(KM[e.key]); else if (e.key == ' ') fire = false;
});
document.querySelectorAll('.pb').forEach(function (b) {
  var d = +b.dataset.d;
  b.addEventListener('pointerdown', function (e) { e.preventDefault(); press(d); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { b.addEventListener(n, function () { release(d); }); });
});
var fb = $('fb');
fb.addEventListener('pointerdown', function (e) { e.preventDefault(); fire = true; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { fb.addEventListener(n, function () { fire = false; }); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

map = genMap(1); player = mk(0, 0, 'p'); player.alive = false;
menu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
